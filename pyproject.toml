[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-stock-price-prediction-program"
version = "0.1.0"
description = "Realtime Korean stock prediction research and paper trading foundation."
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["app*"]
